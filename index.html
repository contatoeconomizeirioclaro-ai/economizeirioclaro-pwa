<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Economizei Rio Claro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  
  <script>
    // DETECÇÃO E REDIRECIONAMENTO IMEDIATO
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const isNativeApp = urlParams.get('source') === 'android_native';
      
      if (isNativeApp) {
        // URL FINAL DO SITE PRINCIPAL - SUBDOMÍNIO APP (OTIMIZADO)
        const finalUrl = new URL('https://app.economizeirioclaro.com.br/');
        
        // PARÂMETROS OBRIGATÓRIOS
        finalUrl.searchParams.set('app', '1');
        finalUrl.searchParams.set('m', '1');
        
        // PARÂMETROS DE OTIMIZAÇÃO APP NATIVO
        finalUrl.searchParams.set('native_app', 'true');
        finalUrl.searchParams.set('platform', 'android_native');
        finalUrl.searchParams.set('app_optimized', 'true');
        finalUrl.searchParams.set('source', 'android_native');
        
        console.log('🔄 Redirecionando app nativo para:', finalUrl.toString());
        
        // REDIRECIONAMENTO TOTAL
        window.location.href = finalUrl.toString();
      }
    })();
  </script>
  
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .loading {
      color: #0055A4;
      margin-top: 50px;
    }
  </style>
</head>

<body>
  <div class="loading">
    <p>Redirecionando para Economizei Rio Claro...</p>
    <p>Se não redirecionar automaticamente, <a href="https://app.economizeirioclaro.com.br/?app=1&m=1&source=pwa">clique aqui</a>.</p>
  </div>

  <script>
    // FALLBACK: se não redirecionou em 3 segundos
    setTimeout(function() {
      if (!window.location.search.includes('source=android_native')) {
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
                            window.navigator.standalone === true;
        
        if (isStandalone) {
          document.body.innerHTML = `
            <iframe 
              src="https://app.economizeirioclaro.com.br/?app=1&source=pwa" 
              style="width:100%; height:100vh; border:none;"
              title="Economizei Rio Claro"
            ></iframe>
          `;
        }
      }
    }, 3000);
  </script>
</body>
</html>
</script>

<script src="/splash.js"></script>
</body>
</html>
